[package]
name = "ddb-e2e"
version = "0.2.2"
edition = "2021"
license = "BUSL-1.1"
publish = false

[[test]]
name = "e2e"
path = "e2e/main.rs"
harness = true

[dependencies]
assert_cmd = "2"
predicates = "3"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json"] }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["rt", "rt-multi-thread"] }
tokio-postgres = "0.7"
tungstenite = { version = "0.28", features = ["handshake"] }
url = "2"
