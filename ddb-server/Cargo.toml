[package]
name = "ddb-server"
version = "0.2.6"
edition = "2021"
license = "BUSL-1.1"
repository = "https://github.com/doogat/ddb"
description = "GraphQL/REST/PgWire server for Doogat DB"

[dependencies]
ddb-core = { path = "../ddb-core", features = ["nosql"] }
tokio = { version = "1", features = ["fs", "macros", "net", "rt-multi-thread", "sync", "time"] }
arc-swap = "1"
axum = { version = "0.8", features = ["ws"] }
base64 = "0.22"
async-graphql = { version = "7", features = ["dynamic-schema"] }
async-graphql-axum = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
futures-util = "0.3"
async-trait = "0.1"
pgwire = "0.25"
indexmap = "2"
tower-http = { version = "0.6", features = ["trace"] }
tracing = "0.1"
rand = "0.9"
rusqlite = { version = "0.32", features = ["bundled"] }
sqlparser = "0.55"
uuid = { version = "1", features = ["v4"] }
toml = "0.8"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports", "async_tokio"] }
reqwest = { version = "0.12", default-features = false, features = ["json"] }
tempfile = "3"
tokio = { version = "1", features = ["fs", "macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-postgres = "0.7"
tower = { version = "0.5", features = ["util"] }

[[bench]]
name = "server_load"
harness = false
