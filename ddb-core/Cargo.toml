[package]
name = "ddb-core"
version = "0.2.7"
edition = "2021"
license = "BUSL-1.1"
repository = "https://github.com/doogat/ddb"
description = "Core library for Doogat DB — a hybrid Git-CRDT database"
autobenches = false

[lib]
crate-type = ["lib", "cdylib", "staticlib"]

[dependencies]
automerge = "0.7"
chrono = { version = "0.4", features = ["serde"] }
# Cross-platform advisory file locking for the repo write lock (Unix flock +
# Windows LockFileEx); `rustix`'s flock is Unix-only and misses the Windows CI matrix.
fs2 = "0.4"
# git2 0.21 dropped ssh/https/cred from default features; restore them so remote sync keeps working
git2 = { version = "0.21", default-features = false, features = ["ssh", "https"] }
hostname = "0.4"
rayon = "1"
tracing = "0.1"
regex = "1"
rusqlite = { version = "0.32", features = ["bundled", "vtab"] }
sqlparser = "0.55"
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
similar = "2"
thiserror = "2"
toml = "0.8"
uniffi = "0.29"
uuid = { version = "1", features = ["v4"] }
tar = "0.4"
sha2 = "0.10"

redb = { version = "2", optional = true }
serde_json = { version = "1", optional = true }

[features]
profiling = []
nosql = ["redb", "serde_json"]
vendored = ["git2/vendored-libgit2", "git2/vendored-openssl"]

[dev-dependencies]
chrono = "0.4"
criterion = { version = "0.5", features = ["html_reports"] }
proptest = "1"
tempfile = "3"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
walkdir = "2"

[[bench]]
name = "crud"
harness = false

[[bench]]
name = "search"
harness = false

[[bench]]
name = "sync"
harness = false

[[bench]]
name = "growth"
harness = false

[[bench]]
name = "large_scale"
harness = false

[[bench]]
name = "typed_insert"
harness = false
