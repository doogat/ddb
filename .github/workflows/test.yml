name: Test

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libssl-dev pkg-config

      - name: Configure git identity
        run: |
          git config --global user.email "ci@ddb.dev"
          git config --global user.name "Doogat DB CI"

      - name: Dependency policy
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses sources advisories

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build CLI binary
        run: cargo build -p ddb-cli --bin ddb

      - name: Fast cargo test tier
        run: cargo test-ci

      - name: Smoke test
        env:
          DDB_BIN: ${{ github.workspace }}/target/debug/ddb
        run: ./tests/smoke.sh

      - name: Sync integration tests
        run: cargo test -p ddb-core --test sync_test

      - name: E2E - GraphQL CRUD
        env:
          DDB_BIN: ${{ github.workspace }}/target/debug/ddb
        run: cargo test -p ddb-e2e --test e2e serve::crud_lifecycle -- --exact

      - name: E2E - PgWire
        env:
          DDB_BIN: ${{ github.workspace }}/target/debug/ddb
        run: cargo test -p ddb-e2e --test e2e pgwire::pgwire_insert_update_delete -- --exact

      - name: E2E - WebSocket subscriptions
        env:
          DDB_BIN: ${{ github.workspace }}/target/debug/ddb
        run: cargo test -p ddb-e2e --test e2e subscriptions::subscribe_mutate_receive -- --exact

      - name: E2E - Sync/CRDT
        env:
          DDB_BIN: ${{ github.workspace }}/target/debug/ddb
        run: cargo test -p ddb-e2e --test e2e sync_crdt::overlapping_body_edits_resolved_by_crdt -- --exact

      - name: E2E - Multi-device
        env:
          DDB_BIN: ${{ github.workspace }}/target/debug/ddb
        run: cargo test -p ddb-e2e --test e2e multi_device::stale_node_returns -- --exact

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - uses: Swatinem/rust-cache@v2

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libssl-dev pkg-config

      - name: Configure git identity
        run: |
          git config --global user.email "ci@ddb.dev"
          git config --global user.name "Doogat DB CI"

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Run coverage
        run: cargo llvm-cov --workspace --exclude ddb-e2e --fail-under-lines 70
