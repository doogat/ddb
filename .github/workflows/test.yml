name: Test

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libssl-dev pkg-config

      - name: Configure git identity
        run: |
          git config --global user.email "ci@ddb.dev"
          git config --global user.name "Doogat DB CI"

      - name: Dependency policy
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses sources advisories

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build CLI binary
        run: cargo build -p ddb-cli --bin ddb

      - name: Fast cargo test tier
        run: cargo test-ci

      - name: E2E tests
        run: cargo test -p ddb-e2e

      - name: Sync integration tests
        run: cargo test -p ddb-core --test sync_test

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - uses: Swatinem/rust-cache@v2

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libssl-dev pkg-config

      - name: Configure git identity
        run: |
          git config --global user.email "ci@ddb.dev"
          git config --global user.name "Doogat DB CI"

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Run coverage
        run: cargo llvm-cov --workspace --exclude ddb-e2e --fail-under-lines 70
